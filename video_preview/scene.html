<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>hypbr deterministic video renderer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0e14; font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
  #canvas { width: 100vw; height: 100vh; display: block; }
  /* Subtle corner title & channel-wipe HUD (only shown when active) */
  #hud-title {
    position: fixed; left: 28px; bottom: 24px; color: rgba(238, 242, 248, 0.88);
    font-size: 16px; font-weight: 600; letter-spacing: 0.03em;
    background: rgba(12, 16, 24, 0.68); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; padding: 6px 12px;
    pointer-events: none;
  }
  #wipe-bar {
    position: fixed; top: 0; bottom: 0; width: 2px; background: rgba(94, 234, 212, 0.92);
    box-shadow: 0 0 12px rgba(94, 234, 212, 0.75); display: none; pointer-events: none;
  }
  .pill {
    position: fixed; top: 24px; padding: 6px 13px; border-radius: 999px;
    font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
    color: #eef2f8; background: rgba(12, 16, 24, 0.78);
    border: 1px solid rgba(94, 234, 212, 0.45); display: none; pointer-events: none;
  }
  #pill-left { left: 28px; }
  #pill-right { right: 28px; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="wipe-bar"></div>
<div id="pill-left" class="pill"></div>
<div id="pill-right" class="pill"></div>
<div id="hud-title"></div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const params = new URLSearchParams(location.search);
const matName = params.get("name") || "material";
const showLabel = params.get("label") !== "0";
const hudTitle = document.getElementById("hud-title");
if (showLabel) {
  hudTitle.textContent = matName;
} else {
  hudTitle.style.display = "none";
}

const canvas = document.getElementById("canvas");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(window.innerWidth, window.innerHeight, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.98;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0c1017);

// HDRI-style procedural studio environment reflections
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.95;

const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.05, 100);

// Studio 3-point lighting with high-res shadow map
const keyLight = new THREE.DirectionalLight(0xfff1de, 2.25);
keyLight.position.set(2.8, 3.2, 3.0);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 14.0;
keyLight.shadow.camera.left = -2.8;
keyLight.shadow.camera.right = 2.8;
keyLight.shadow.camera.top = 2.8;
keyLight.shadow.camera.bottom = -2.8;
keyLight.shadow.bias = -0.0004;
keyLight.shadow.normalBias = 0.015;

const rimLight = new THREE.DirectionalLight(0x8bb8ff, 0.95);
rimLight.position.set(-3.2, 2.2, -2.5);
const hemi = new THREE.HemisphereLight(0xcbd5e1, 0x1e2430, 0.35);
scene.add(keyLight, rimLight, hemi);

// Helper to load textures cleanly and wait until everything is decoded
const texCache = new Map();
function loadTex(file, srgb = false) {
  return new Promise((resolve) => {
    const k = `${file}:${srgb}`;
    if (texCache.has(k)) { resolve(texCache.get(k)); return; }
    const img = new Image();
    img.onload = () => {
      const tex = new THREE.Texture(img);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(2, 2);
      tex.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
      tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
      tex.needsUpdate = true;
      texCache.set(k, tex);
      resolve(tex);
    };
    img.onerror = () => resolve(null);
    img.src = `./mat/${file}`;
  });
}

// Check if opacity.png exists and has meaningful cutout holes (>0.5% pixels < 0.5 alpha)
const transparencyMode = (params.get("transparency") || "auto").toLowerCase();
async function detectCutout(opTex) {
  if (transparencyMode === "off") return false;
  if (!opTex || !opTex.image) return false;
  if (transparencyMode === "on") return true;
  const img = opTex.image;
  const c = document.createElement("canvas");
  c.width = Math.min(img.width, 128);
  c.height = Math.min(img.height, 128);
  const ctx = c.getContext("2d");
  ctx.drawImage(img, 0, 0, c.width, c.height);
  const d = ctx.getImageData(0, 0, c.width, c.height).data;
  let holeCount = 0;
  const totalPx = d.length / 4;
  for (let i = 0; i < d.length; i += 4) {
    if (d[i] < 128) holeCount++;
  }
  return totalPx > 0 && (holeCount / totalPx) > 0.005;
}

// Load all PBR maps
const [albTex, nrmTex, rghTex, metTex, aoTex, hgtTex, opTex, nrmDispTex, rghDispTex, opDispTex] = await Promise.all([
  loadTex("albedo_delit.png", true),
  loadTex("normal.png", false),
  loadTex("roughness.png", false),
  loadTex("metallic.png", false),
  loadTex("ao.png", false),
  loadTex("height.png", false),
  loadTex("opacity.png", false),
  loadTex("normal.png", true),
  loadTex("roughness.png", true),
  loadTex("opacity.png", true),
]);

const hasCutout = await detectCutout(opTex);

// Build primary PBR material + channel inspection materials for channel_split shot
const dispScaleBase = hasCutout ? 0.024 : 0.036;
const pbrMat = new THREE.MeshPhysicalMaterial({
  map: albTex,
  normalMap: nrmTex,
  normalScale: new THREE.Vector2(1.1, 1.1),
  roughnessMap: rghTex,
  metalnessMap: metTex,
  aoMap: aoTex,
  aoMapIntensity: 0.9,
  displacementMap: hgtTex,
  displacementScale: dispScaleBase,
  displacementBias: -dispScaleBase * 0.5,
  roughness: 1.0,
  metalness: 1.0,
});

const depthMat = new THREE.MeshDepthMaterial({
  depthPacking: THREE.RGBADepthPacking,
  displacementMap: hgtTex,
  displacementScale: dispScaleBase,
  displacementBias: -dispScaleBase * 0.5,
});

if (hasCutout && opTex) {
  pbrMat.alphaMap = opTex;
  pbrMat.alphaTest = 0.5;
  pbrMat.side = THREE.DoubleSide;
  depthMat.alphaMap = opTex;
  depthMat.alphaTest = 0.5;
}

// Channel-visualization materials (all share real vertex displacement so splits align pixel-for-pixel!)
function makeFlatMat(tex) {
  const m = new THREE.MeshBasicMaterial({
    map: tex,
    side: hasCutout ? THREE.DoubleSide : THREE.FrontSide,
  });
  if (hasCutout && opTex) {
    m.alphaMap = opTex;
    m.alphaTest = 0.5;
  }
  return m;
}
// Wait: MeshBasicMaterial doesn't support displacementMap in Three.js; use unlit-style Shader/Standard or displaced MeshStandardMaterial with emissiveMap!
// Using MeshStandardMaterial with color=0, emissive=white, emissiveMap=tex gives EXACT channel colors + identical vertex displacement + alphaTest!
function makeDisplacedChannelMat(tex, useAlpha = true) {
  const m = new THREE.MeshStandardMaterial({
    color: 0x000000,
    emissive: 0xffffff,
    emissiveMap: tex,
    roughness: 1.0,
    metalness: 0.0,
    toneMapped: false,
    displacementMap: hgtTex,
    displacementScale: dispScaleBase,
    displacementBias: -dispScaleBase * 0.5,
    side: hasCutout ? THREE.DoubleSide : THREE.FrontSide,
  });
  if (hasCutout && opTex && useAlpha) {
    m.alphaMap = opTex;
    m.alphaTest = 0.5;
  }
  return m;
}

const matAlbedo = makeDisplacedChannelMat(albTex, true);
const matNormal = makeDisplacedChannelMat(nrmDispTex, true);
const matRough = makeDisplacedChannelMat(rghDispTex, true);
const matOpacity = makeDisplacedChannelMat(opDispTex || rghDispTex, false);

// Mesh selector: auto = current studio layout; otherwise a single hero shape for every shot
const MESH_MODES = new Set(["auto", "sphere", "cube", "cylinder", "plane"]);
const requestedMesh = (params.get("mesh") || "auto").toLowerCase();
const meshMode = MESH_MODES.has(requestedMesh) ? requestedMesh : "auto";
const useExplicitMesh = meshMode !== "auto";

if (meshMode === "plane") {
  pbrMat.side = THREE.DoubleSide;
  depthMat.side = THREE.DoubleSide;
  for (const m of [matAlbedo, matNormal, matRough, matOpacity]) {
    m.side = THREE.DoubleSide;
  }
  // Slightly wider / longer shadow frustum so a grazing light still covers the plane
  keyLight.shadow.camera.left = -3.6;
  keyLight.shadow.camera.right = 3.6;
  keyLight.shadow.camera.top = 3.6;
  keyLight.shadow.camera.bottom = -3.6;
  keyLight.shadow.camera.far = 18.0;
  hemi.intensity = 0.48;
}

// Build studio floor & backdrop wall
const floorGeo = new THREE.PlaneGeometry(18, 18);
const floorMat = new THREE.MeshStandardMaterial({
  color: hasCutout ? 0x3b4048 : 0x151922,
  roughness: 0.85,
  metalness: 0.05,
});
const floorMesh = new THREE.Mesh(floorGeo, floorMat);
floorMesh.rotation.x = -Math.PI / 2;
floorMesh.position.y = -0.96;
floorMesh.receiveShadow = true;
scene.add(floorMesh);

// Scene hero group (rotates during turntable / channel_split)
const heroGroup = new THREE.Group();
scene.add(heroGroup);

let heroSphere = null;
let heroBlock = null;
let fencePanel = null;
let tilingPlane = null;
let wallMesh = null;
const displacedMeshes = [];

function addDisplaced(geo, parent = heroGroup) {
  geo.setAttribute("uv2", geo.attributes.uv);
  const mesh = new THREE.Mesh(geo, pbrMat);
  mesh.customDepthMaterial = depthMat;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  displacedMeshes.push(mesh);
  return mesh;
}

if (hasCutout) {
  // Warm sunlit architectural wall so cutout holes + diamond shadows read clearly
  scene.background = new THREE.Color(0x232832);
  const wallGeo = new THREE.PlaneGeometry(12, 7);
  const wallMat = new THREE.MeshStandardMaterial({
    color: 0xa69d92,
    roughness: 0.92,
    metalness: 0.0,
  });
  wallMesh = new THREE.Mesh(wallGeo, wallMat);
  wallMesh.position.set(0, 1.0, meshMode === "plane" ? -1.55 : -1.25);
  wallMesh.receiveShadow = true;
  scene.add(wallMesh);
}

if (meshMode === "plane") {
  // Flat, finely subdivided displaced plane, tilted ~40° from horizontal and viewed at 35-45°
  const mesh = addDisplaced(new THREE.PlaneGeometry(2.55, 2.55, 256, 256));
  mesh.rotation.x = -Math.PI / 2 + (40 * Math.PI / 180);
  mesh.position.set(0, 0.02, 0);
} else if (meshMode === "sphere") {
  const mesh = addDisplaced(new THREE.SphereGeometry(0.82, 192, 192));
  mesh.position.set(0, -0.08, 0);
} else if (meshMode === "cube") {
  const mesh = addDisplaced(new THREE.BoxGeometry(1.28, 1.28, 1.28, 96, 96, 96));
  mesh.position.set(0, -0.08, 0);
  mesh.rotation.set(0.12, 0.35, 0);
} else if (meshMode === "cylinder") {
  const mesh = addDisplaced(new THREE.CylinderGeometry(0.62, 0.62, 1.45, 128, 96, false));
  mesh.position.set(0, -0.08, 0);
} else if (hasCutout) {
  // auto + cutout: framed fence panel (original studio layout)
  const panelGeo = new THREE.PlaneGeometry(2.25, 1.70, 192, 144);
  fencePanel = addDisplaced(panelGeo);
  fencePanel.position.set(0, 0.05, 0.0);

  const railMat = new THREE.MeshStandardMaterial({ color: 0x383e46, metalness: 0.85, roughness: 0.35 });
  const topRail = new THREE.Mesh(new THREE.CylinderGeometry(0.032, 0.032, 2.34, 24), railMat);
  topRail.rotation.z = Math.PI / 2;
  topRail.position.set(0, 0.91, 0);
  topRail.castShadow = true;
  const botRail = topRail.clone();
  botRail.position.set(0, -0.81, 0);
  const leftPost = new THREE.Mesh(new THREE.CylinderGeometry(0.038, 0.038, 1.92, 24), railMat);
  leftPost.position.set(-1.14, -0.02, 0);
  leftPost.castShadow = true;
  const rightPost = leftPost.clone();
  rightPost.position.set(1.14, -0.02, 0);
  heroGroup.add(topRail, botRail, leftPost, rightPost);

  const tileGeo = new THREE.PlaneGeometry(3.4, 2.5, 192, 144);
  tilingPlane = addDisplaced(tileGeo, scene);
  tilingPlane.visible = false;
} else {
  // auto + opaque: displaced sphere + rounded swatch (original studio layout)
  const sphereGeo = new THREE.SphereGeometry(0.76, 192, 192);
  heroSphere = addDisplaced(sphereGeo);
  heroSphere.position.set(-0.82, -0.10, 0.0);

  const swatchGroup = new THREE.Group();
  swatchGroup.position.set(0.84, -0.10, 0.0);
  swatchGroup.rotation.set(-0.16, -0.22, 0.0);
  const backingGeo = new THREE.BoxGeometry(1.32, 1.32, 0.08);
  const backingMat = new THREE.MeshStandardMaterial({ color: 0x1b2029, roughness: 0.45, metalness: 0.7 });
  const backingMesh = new THREE.Mesh(backingGeo, backingMat);
  backingMesh.castShadow = true;
  backingMesh.receiveShadow = true;
  backingMesh.position.z = -0.045;
  swatchGroup.add(backingMesh);

  const tileFaceGeo = new THREE.PlaneGeometry(1.22, 1.22, 192, 192);
  heroBlock = addDisplaced(tileFaceGeo, swatchGroup);
  heroBlock.position.z = 0.004;
  heroGroup.add(swatchGroup);

  const tileGeo = new THREE.PlaneGeometry(3.2, 3.2, 224, 224);
  tilingPlane = addDisplaced(tileGeo, scene);
  tilingPlane.rotation.x = -0.35;
  tilingPlane.visible = false;
}

function setRepeat(rx, ry) {
  for (const t of texCache.values()) {
    t.repeat.set(rx, ry);
  }
}

function setDisplacedMat(mat) {
  for (const m of displacedMeshes) m.material = mat;
}

function setDispScale(sc) {
  for (const m of [pbrMat, depthMat, matAlbedo, matNormal, matRough, matOpacity]) {
    m.displacementScale = sc;
    m.displacementBias = -sc * 0.5;
  }
}

function placeGrazingLight(azimuth, elevationDeg = 20, radius = 4.2, yBoost = 0.35) {
  const el = elevationDeg * Math.PI / 180;
  keyLight.position.set(
    Math.sin(azimuth) * radius * Math.cos(el),
    Math.sin(el) * radius + yBoost,
    Math.cos(azimuth) * radius * Math.cos(el),
  );
}

function placeOrbitCamera(azimuth, elevationDeg, distance, targetY = 0.02) {
  const el = elevationDeg * Math.PI / 180;
  camera.position.set(
    Math.sin(azimuth) * distance * Math.cos(el),
    Math.sin(el) * distance,
    Math.cos(azimuth) * distance * Math.cos(el),
  );
  camera.lookAt(0, targetY, 0);
}

function applyExplicitMeshCamera(shotType, u) {
  const tilingT = 0.5 - 0.5 * Math.cos(u * Math.PI);
  if (shotType === "tiling_zoom") {
    const rep = 1.5 + 3.0 * tilingT;
    setRepeat(rep, hasCutout ? rep * 0.75 : rep);
  } else {
    setRepeat(hasCutout ? 1.5 : 2.0, hasCutout ? 1.15 : 2.0);
  }
  if (shotType === "closeup_displacement") {
    setDispScale(hasCutout ? 0.034 : 0.070);
  }
  heroGroup.rotation.set(0, 0, 0);

  if (meshMode === "plane") {
    // View the displaced plane at ~35-45° with a grazing light so relief reads
    let az = 0.18;
    let dist = 3.15;
    let elev = 38;
    if (shotType === "turntable") {
      az = 0.18 + Math.sin(u * Math.PI * 2.0) * 0.55;
      dist = 3.15 + 0.08 * Math.cos(u * Math.PI * 2.0);
    } else if (shotType === "closeup_displacement") {
      const t = 0.5 - 0.5 * Math.cos(u * Math.PI);
      az = -0.35 + 0.70 * t;
      dist = 2.15 - 0.55 * t;
      elev = 28;
    } else if (shotType === "tiling_zoom") {
      dist = 2.6 + 1.2 * tilingT;
    } else if (shotType === "channel_split") {
      heroGroup.rotation.set(0, Math.sin(u * Math.PI) * 0.12, 0);
    }
    placeOrbitCamera(az, elev, dist, 0.02);
    if (shotType === "lightorbit") {
      placeGrazingLight(-0.95 + u * 1.90, 18, 4.2, 0.35);
    } else {
      placeGrazingLight(0.55 + (shotType === "turntable" ? u * 0.35 : 0), 22, 4.0, 0.4);
    }
    return;
  }

  // sphere / cube / cylinder — orbit around a centered hero
  if (shotType === "turntable") {
    const az = u * Math.PI * 2.0 + 0.35;
    const rad = 3.55;
    const el = 0.55 + 0.22 * Math.sin(u * Math.PI * 2.0);
    camera.position.set(Math.sin(az) * rad, el, Math.cos(az) * rad);
    camera.lookAt(0, -0.05, 0);
    keyLight.position.set(2.8, 3.2, 3.0);
  } else if (shotType === "lightorbit") {
    camera.position.set(0.15, 0.62, 3.35);
    camera.lookAt(0, -0.08, 0);
    const az = u * Math.PI * 2.0 + 0.4;
    keyLight.position.set(Math.sin(az) * 4.0, 2.2 + 0.8 * Math.cos(u * Math.PI * 2.0), Math.cos(az) * 4.0);
  } else if (shotType === "closeup_displacement") {
    const t = 0.5 - 0.5 * Math.cos(u * Math.PI);
    camera.position.set(-1.15 + 2.2 * t, 0.55 - 0.22 * t, 2.05 - 0.45 * t);
    camera.lookAt(0, -0.05, 0);
    keyLight.position.set(2.4, 2.4, 2.2);
  } else if (shotType === "tiling_zoom") {
    camera.position.set(0.0, 0.45 + 0.35 * tilingT, 2.55 + 1.2 * tilingT);
    camera.lookAt(0, -0.05, 0);
    keyLight.position.set(2.4, 3.0, 2.8);
  } else {
    if (shotType === "channel_split") {
      heroGroup.rotation.set(0, u * 0.65 - 0.2, 0);
    }
    camera.position.set(0.0, 0.55, 3.35);
    camera.lookAt(0, -0.08, 0);
    keyLight.position.set(2.8, 3.2, 3.0);
  }
}

function renderChannelSplit(u, w, h) {
  let leftMat = pbrMat, rightMat = pbrMat, leftLbl = "Final Lit PBR", rightLbl = "Final Lit PBR", splitFrac = 1.0;
  if (hasCutout) {
    if (u < 0.22) {
      splitFrac = u / 0.22;
      leftMat = matNormal; leftLbl = "Normal (OpenGL +Y)";
      rightMat = matAlbedo; rightLbl = "Albedo (De-lit)";
    } else if (u < 0.44) {
      splitFrac = (u - 0.22) / 0.22;
      leftMat = matRough; leftLbl = "Roughness";
      rightMat = matNormal; rightLbl = "Normal (OpenGL +Y)";
    } else if (u < 0.66) {
      splitFrac = (u - 0.44) / 0.22;
      leftMat = matOpacity; leftLbl = "Opacity (Cutout)";
      rightMat = matRough; rightLbl = "Roughness";
    } else if (u < 0.88) {
      splitFrac = (u - 0.66) / 0.22;
      leftMat = pbrMat; leftLbl = "Final Lit PBR";
      rightMat = matOpacity; rightLbl = "Opacity (Cutout)";
    } else {
      splitFrac = 1.0;
      leftMat = pbrMat; leftLbl = "Final Lit PBR";
      rightMat = pbrMat; rightLbl = "Final Lit PBR";
    }
  } else {
    if (u < 0.28) {
      splitFrac = u / 0.28;
      leftMat = matNormal; leftLbl = "Normal (OpenGL +Y)";
      rightMat = matAlbedo; rightLbl = "Albedo (De-lit)";
    } else if (u < 0.56) {
      splitFrac = (u - 0.28) / 0.28;
      leftMat = matRough; leftLbl = "Roughness";
      rightMat = matNormal; rightLbl = "Normal (OpenGL +Y)";
    } else if (u < 0.84) {
      splitFrac = (u - 0.56) / 0.28;
      leftMat = pbrMat; leftLbl = "Final Lit PBR";
      rightMat = matRough; rightLbl = "Roughness";
    } else {
      splitFrac = 1.0;
      leftMat = pbrMat; leftLbl = "Final Lit PBR";
      rightMat = pbrMat; rightLbl = "Final Lit PBR";
    }
  }

  const splitPx = Math.round(splitFrac * w);
  if (splitPx > 2 && splitPx < w - 2) {
    renderer.setScissorTest(true);
    setDisplacedMat(leftMat);
    renderer.setScissor(0, 0, splitPx, h);
    renderer.render(scene, camera);
    setDisplacedMat(rightMat);
    renderer.setScissor(splitPx, 0, w - splitPx, h);
    renderer.render(scene, camera);
    renderer.setScissorTest(false);

    wipeBar.style.display = "block";
    wipeBar.style.left = `${splitPx}px`;
    pillL.style.display = "block";
    pillL.textContent = leftLbl;
    pillR.style.display = "block";
    pillR.textContent = rightLbl;
  } else {
    setDisplacedMat(leftMat);
    renderer.render(scene, camera);
    pillL.style.display = "block";
    pillL.textContent = leftLbl;
  }
}

const wipeBar = document.getElementById("wipe-bar");
const pillL = document.getElementById("pill-left");
const pillR = document.getElementById("pill-right");

// Deterministic per-frame evaluation called by Playwright
window.__renderFrame = function(frameIdx, totalFrames, shotType) {
  const u = totalFrames > 1 ? frameIdx / (totalFrames - 1) : 0.0;
  const w = window.innerWidth;
  const h = window.innerHeight;

  // Reset defaults each frame
  wipeBar.style.display = "none";
  pillL.style.display = "none";
  pillR.style.display = "none";
  renderer.setScissorTest(false);
  setDisplacedMat(pbrMat);
  setDispScale(dispScaleBase);
  heroGroup.visible = true;
  if (tilingPlane) tilingPlane.visible = false;
  if (wallMesh) wallMesh.visible = hasCutout;

  if (useExplicitMesh) {
    applyExplicitMeshCamera(shotType, u);
    if (shotType === "channel_split") {
      renderChannelSplit(u, w, h);
    } else {
      renderer.render(scene, camera);
    }
    return;
  }

  if (shotType === "turntable") {
    setRepeat(hasCutout ? 1.5 : 2.0, hasCutout ? 1.15 : 2.0);
    if (hasCutout) {
      // Gently sway panel back & forth (+-42 deg) so front, angled weave, & cast shadow stay framed
      const ang = Math.sin(u * Math.PI * 2.0) * 0.65;
      heroGroup.rotation.set(0, ang, 0);
      camera.position.set(Math.sin(u * Math.PI * 2.0) * 0.6, 0.25 + 0.12 * Math.cos(u * Math.PI * 2.0), 3.15);
      camera.lookAt(0, 0.0, -0.2);
      keyLight.position.set(2.2, 2.6, 3.2);
    } else {
      heroGroup.rotation.set(0, 0, 0);
      const az = u * Math.PI * 2.0 + 0.35;
      const rad = 3.85;
      const elev = 0.55 + 0.22 * Math.sin(u * Math.PI * 2.0);
      camera.position.set(Math.sin(az) * rad, elev, Math.cos(az) * rad);
      camera.lookAt(0, -0.1, 0);
      keyLight.position.set(2.8, 3.2, 3.0);
    }
    renderer.render(scene, camera);
    return;
  }

  if (shotType === "lightorbit") {
    setRepeat(hasCutout ? 1.5 : 2.0, hasCutout ? 1.15 : 2.0);
    heroGroup.rotation.set(0, hasCutout ? -0.22 : 0.0, 0);
    if (hasCutout) {
      camera.position.set(0.45, 0.32, 3.10);
      camera.lookAt(0.0, -0.02, -0.35);
      // Orbit key light in front hemisphere so shadow sweeps across the sunlit wall & floor behind fence
      const az = -0.95 + u * 1.90;
      keyLight.position.set(Math.sin(az) * 3.8, 1.7 + 0.9 * Math.sin(u * Math.PI * 2.0), Math.cos(az) * 3.6);
    } else {
      camera.position.set(0.0, 0.55, 3.45);
      camera.lookAt(0, -0.12, 0);
      const az = u * Math.PI * 2.0 + 0.4;
      keyLight.position.set(Math.sin(az) * 4.0, 2.4 + 0.8 * Math.cos(u * Math.PI * 2.0), Math.cos(az) * 4.0);
    }
    renderer.render(scene, camera);
    return;
  }

  if (shotType === "closeup_displacement") {
    setRepeat(hasCutout ? 1.4 : 2.0, hasCutout ? 1.1 : 2.0);
    setDispScale(hasCutout ? 0.032 : 0.068);
    heroGroup.rotation.set(0, 0, 0);
    if (hasCutout) {
      // Smooth macro push-in across the woven knuckles at a grazing angle
      const t = 0.5 - 0.5 * Math.cos(u * Math.PI);
      camera.position.set(-0.7 + 1.4 * t, 0.22 - 0.12 * t, 2.15 - 0.95 * t);
      camera.lookAt(0.05 * t, 0.02, 0);
      keyLight.position.set(2.4, 2.2, 2.5);
    } else {
      // Sweep close across the hero sphere's displaced silhouette & into the slab bevels
      const t = 0.5 - 0.5 * Math.cos(u * Math.PI);
      camera.position.set(-1.35 + 2.10 * t, 0.48 - 0.26 * t, 2.15 - 0.65 * t);
      camera.lookAt(-0.45 + 0.95 * t, -0.08, 0.05);
      keyLight.position.set(2.6 - 1.5 * t, 2.6, 2.2);
    }
    renderer.render(scene, camera);
    return;
  }

  if (shotType === "tiling_zoom") {
    heroGroup.visible = false;
    if (wallMesh) wallMesh.visible = false;
    tilingPlane.visible = true;
    const t = 0.5 - 0.5 * Math.cos(u * Math.PI);
    const rep = 1.5 + 3.0 * t;
    setRepeat(rep, hasCutout ? rep * 0.75 : rep);
    camera.position.set(0.0, 0.55 * (1.0 - t) + 0.2 * t, 2.35 + 1.15 * t);
    camera.lookAt(0, 0, 0);
    keyLight.position.set(2.2, 3.0, 2.8);
    renderer.render(scene, camera);
    return;
  }

  if (shotType === "channel_split") {
    setRepeat(hasCutout ? 1.5 : 2.0, hasCutout ? 1.15 : 2.0);
    if (hasCutout) {
      heroGroup.rotation.set(0, Math.sin(u * Math.PI) * 0.25 - 0.12, 0);
      camera.position.set(0.25, 0.22, 3.05);
      camera.lookAt(0, 0.0, -0.2);
      keyLight.position.set(2.0, 2.5, 3.2);
    } else {
      heroGroup.rotation.set(0, u * 0.65 - 0.2, 0);
      camera.position.set(0.0, 0.52, 3.45);
      camera.lookAt(0, -0.1, 0);
      keyLight.position.set(2.8, 3.2, 3.0);
    }

    renderChannelSplit(u, w, h);
    return;
  }

  // Default hero still
  setRepeat(hasCutout ? 1.5 : 2.0, hasCutout ? 1.15 : 2.0);
  heroGroup.rotation.set(0, hasCutout ? -0.18 : 0.0, 0);
  if (hasCutout) {
    camera.position.set(0.35, 0.24, 3.00);
    camera.lookAt(0, -0.02, -0.25);
    keyLight.position.set(2.2, 2.3, 3.0);
  } else {
    camera.position.set(0.0, 0.45, 3.35);
    camera.lookAt(0, -0.1, 0);
    keyLight.position.set(2.7, 3.1, 3.0);
  }
  renderer.render(scene, camera);
};

window.__ready = true;
</script>
</body>
</html>
